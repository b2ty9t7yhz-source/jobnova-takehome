name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run static checks, unit tests, and production builds
        run: npm run check

      - name: Run browser-backed workflow tests
        run: npm run test:browser

      - name: Run frontend end-to-end tests
        run: npm run test:e2e:web

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-evidence
          path: artifacts/web-e2e/
          if-no-files-found: ignore
          retention-days: 14
